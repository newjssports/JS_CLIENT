<form [formGroup]="fabricForm">
    <div class="row">
        <div class="col-lg-3 col-md-6">
            <mat-form-field class="margin-field" appearance="fill" *ngIf="productList.length > 0">
                <mat-label>Select Item</mat-label>
                <mat-select formControlName="productId" required
                [panelClass]="isMobile ? 'mobile-select-panel' : ''">
                    <mat-option *ngFor="let item of productList" [value]="item.productId">
                        {{ item.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>

    <div formArrayName="fabrics">
        <div *ngFor="let fabric of fabrics.controls; let i = index" [formGroupName]="i" class="row">
            <div class="col-lg-3 col-md-6">
                <mat-form-field appearance="fill">
                    <mat-label>Name</mat-label>
                    <input matInput formControlName="name" required>
                    <mat-error *ngIf="fabric.get('name')?.invalid && fabric.get('name')?.touched">
                        Name is required.
                    </mat-error>
                </mat-form-field>
            </div>
            
            <!-- <div class="col-lg-3 col-md-6">
                <mat-form-field appearance="fill">
                    <mat-label>Code</mat-label>
                    <input matInput formControlName="code">
                </mat-form-field>
            </div> -->
            
            <div class="col-lg-3 col-md-6">
                <mat-form-field appearance="fill">
                    <mat-label>Description</mat-label>
                    <input matInput formControlName="description">
                </mat-form-field>
            </div>
    
            <div class="col-lg-3 col-md-6 d-flex align-items-center">
                <button mat-icon-button color="primary" (click)="addFabric()"
                        [disabled]="!isAddButtonEnabled(i)"
                        *ngIf="i === (fabrics.length - 1)">
                    <mat-icon>add</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="removeFabric(i)">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8"></div>
        <div class="col-lg-2">
            <button mat-raised-button color="primary" (click)="addAllFabrics()" 
                    [disabled]="fabricForm.invalid"
                    *ngIf="selectedCategoryIndex === null">
                Add
            </button>
        </div>
        <div class="col-lg-2">    
            <button mat-raised-button color="accent" (click)="updateMainCategory()" 
                    *ngIf="selectedCategoryIndex !== null">
                Update
            </button>
        </div>
    </div>
</form>
